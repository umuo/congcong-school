name: iOS Cloud IPA
on:
  push:
    branches: ['codex/ios-cloud-ipa-*']
    paths: ['apps/mobile/**', 'scripts/build-ios-cloud.sh', '.github/workflows/ios-cloud.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-cloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      IOS_CLOUD_OUT: ${{ github.workspace }}/deploy-output/ios-cloud
      IOS_CLOUD_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          cd apps/mobile
          xcodegen generate --spec project.yml
      - name: Test cloud origin and download boundaries
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if v["name"].startswith("iPhone")))')
          xcodebuild test -project apps/mobile/ChinaTextbookStudy.xcodeproj -scheme ChinaTextbookStudy \
            -destination "id=$DEVICE_ID" -derivedDataPath "$IOS_CLOUD_OUT/TestDerivedData" \
            -resultBundlePath "$IOS_CLOUD_OUT/CloudTests.xcresult" CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/ios-cloud-tests.log" 2>&1 || { tail -150 "$RUNNER_TEMP/ios-cloud-tests.log"; exit 1; }
      - name: Archive and package unsigned device IPA
        run: bash scripts/build-ios-cloud.sh > "$RUNNER_TEMP/ios-cloud-archive.log" 2>&1 || { tail -150 "$RUNNER_TEMP/ios-cloud-archive.log"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: congcong-ios-cloud-unsigned-${{ github.run_number }}
          path: |
            deploy-output/ios-cloud/CongcongCloud-unsigned.ipa
            deploy-output/ios-cloud/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Build logs and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-cloud-checks-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ios-cloud-*.log
            deploy-output/ios-cloud/CloudTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
