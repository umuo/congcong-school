name: ChinaTextbookStudy
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ChinaTextbookStudy:
    type: application
    platform: iOS
    sources:
      - path: ChinaTextbookStudy/App/ChinaTextbookStudyApp.swift
      - path: ChinaTextbookStudy/Cloud
        excludes: [PrivacyInfo.xcprivacy]
    resources:
      - path: ChinaTextbookStudy/Resources/Assets.xcassets
      - path: ChinaTextbookStudy/Cloud/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lacknb.study.cloudtest
        PRODUCT_NAME: ChinaTextbookStudy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: .build/Cloud-Info.plist
      properties:
        CFBundleDisplayName: 聪聪学堂云测
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 跟读时录制你的朗读。录音仅保留在当前学习页面，不上传，离开或刷新页面后清除。
  CloudTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CloudTests
    dependencies:
      - target: ChinaTextbookStudy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lacknb.study.cloudtest.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ChinaTextbookStudy:
    build:
      targets:
        ChinaTextbookStudy: all
    test:
      targets: [CloudTests]
